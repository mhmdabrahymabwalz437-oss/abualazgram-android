name: ABUALAZGRAM Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Inject API credentials for this ephemeral build
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          test -n "$API_ID"
          test -n "$API_HASH"
          ./tools/prepare_ci_credentials.sh

      - name: Limit native build to arm64-v8a
        run: |
          sed -i 's/ndkVersion "27.2.12479018"/ndkVersion "27.2.12479018"\n    ndk { abiFilters "arm64-v8a" }/' TMessagesProj/build.gradle
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/g' TMessagesProj_AppStandalone/build.gradle

      - name: Build standalone debug APK
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abualazgram-debug-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
