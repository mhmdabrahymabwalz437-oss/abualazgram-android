name: ABUALAZGRAM Android Build

on:
  workflow_dispatch:
  push:
    branches: [ rewrite, main ]

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_PLATFORM: android-33
      ANDROID_BUILD_TOOLS: 33.0.1
      ANDROID_NDK_VERSION: 21.4.7075529
      CMAKE_VERSION: 3.22.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Inject API and signing credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
          CERT_KEY: ${{ secrets.CERT_KEY }}
        run: |
          test -n "$TELEGRAM_API_ID"
          test -n "$TELEGRAM_API_HASH"
          # The inherited AyuGram keystore uses this compatibility password when CERT_KEY is absent.
          if [ -z "$CERT_KEY" ]; then CERT_KEY=ayugram; fi
          cat > API_KEYS <<EOF
          APP_ID=$TELEGRAM_API_ID
          APP_HASH="$TELEGRAM_API_HASH"
          MAPS_V2_API="$MAPS_KEY"
          SIGNING_KEY_PASSWORD=$CERT_KEY
          SIGNING_KEY_ALIAS=$CERT_KEY
          SIGNING_KEY_STORE_PASSWORD=$CERT_KEY
          EOF

      - name: Limit native build to arm64-v8a
        run: |
          sed -i '/^    defaultConfig {/a\        ndk { abiFilters "arm64-v8a" }' TMessagesProj/build.gradle

      - name: Build arm64 release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleArm64Release \
            --no-daemon --no-parallel --max-workers=1 --no-configuration-cache \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=1g'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abualazgram-arm64-release
          path: TMessagesProj/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error
